name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3 : version de l'image Docker de production
        # 8.4 : version suivante, pour anticiper
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Dossier du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Lancer les tests
        run: php vendor/bin/phpunit

  docker:
    name: Image Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t bulk-orders:ci .

      - name: Démarrer MySQL
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e MYSQL_DATABASE=app -e MYSQL_USER=app -e MYSQL_PASSWORD=app -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.4 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

      - name: Premier démarrage (base vide)
        run: |
          docker run -d --name app --network ci -p 8080:80 \
            -e APP_SECRET=ci -e MAILER_DSN=null://null -e APP_HOST=localhost \
            -e DATABASE_URL='mysql://app:app@db:3306/app?serverVersion=8.4.0&charset=utf8mb4' \
            bulk-orders:ci
          .github/wait-for-app.sh

      - name: Ressources front présentes dans l'image
        run: |
          # Chaque fichier /plugins/ chargé par un template doit être servi (sinon .dockerignore l'exclut)
          for path in $(grep -rhoE "asset\('/?plugins/[^']+'\)" templates | sed -E "s#asset\('/?##; s#'\)##" | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$path")
            echo "/$path : $code"
            test "$code" = 200
          done

      - name: Redémarrage (migrations déjà passées)
        run: |
          docker restart app
          .github/wait-for-app.sh
          docker logs app 2>&1 | grep -q "Already at the latest version"

      - name: Journaux
        if: always()
        run: docker logs app || true
