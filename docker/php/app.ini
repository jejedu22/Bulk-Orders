expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
; Au moins la somme des pièces jointes d'une newsletter (8 Mo) + le reste du formulaire
post_max_size = 12M
date.timezone = Europe/Paris

; Durcissement (CVE-2026-109618 et CVE-2026-109619, corrigées en PHP 8.4.27).
; Ne remplace pas la mise à jour de PHP.
; Progression d'envoi des sessions : inutilisée par l'application, et chemin
; d'attaque démontré de CVE-2026-109619 (à garder désactivée après correction).
session.upload_progress.enabled = Off
; Profondeur des champs de formulaire : 3 niveaux au plus dans l'application
; (commande[ligneCommandes][0][product]) ; limite l'épuisement mémoire pendant
; l'analyse des requêtes multipart (CVE-2026-109618).
max_input_nesting_level = 16

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
