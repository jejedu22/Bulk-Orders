# Serveur 2 CPU / 4 Go partagé : 8 processus Apache max (défaut : 150).
# Chaque processus PHP peut monter à memory_limit, le conteneur est limité à 320 Mo.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild 500
</IfModule>
